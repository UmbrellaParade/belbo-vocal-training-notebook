name: Build WordPress release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -F " * Version: ${version}" belbo-vocal-training-notebook/belbo-vocal-training-notebook.php
          grep -F "Stable tag: ${version}" belbo-vocal-training-notebook/readme.txt
      - name: Build plugin zip
        shell: bash
        run: zip -r belbo-vocal-training-notebook.zip belbo-vocal-training-notebook -x "*/.DS_Store" "*/Thumbs.db"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: belbo-vocal-training-notebook.zip
          generate_release_notes: true
